[tool.poetry]
name = "Articuno"
version = "v6.0.0"
description = "A fun Discord Bot, written with interactions.py."
license = "GPL-3.0-only"
authors = ["B1ue-Dev <b1uedev@duck.com>"]
readme = "README.md"
homepage = "https://blue.is-a.dev/Articuno"
repository = "https://github.com/B1ue-Dev/Articuno"

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
beanie = "2.1.0"
colorlog = "6.10.1"
interactions.py = "6.0.0rc1"
google-api-python-client = "2.198.0"
googletrans-py = "4.0.0"
Pillow = "11.2.1"
psutil = "7.2.2"
pyfiglet = "1.0.4"
python-dotenv = "1.2.2"
numpy = "2.5.1"

[tool.ruff]
line-length = 79
target-version = "py313"
extend-exclude = [
    ".codesandbox",
    ".db",
    ".conda",
    ".env",
    "env",
    ".venv",
    "test",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501", "W605", "E203", "E231", "E702", "E225", "E226"]

[tool.poetry.dev-dependencies]
ruff = "0.16.5"
poetry = "1.4.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
